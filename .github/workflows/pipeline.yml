name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check commit messages
        id: check
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            let skip = false;
            const pullNumbers = new Set();

            if (context.eventName === 'pull_request') {
              pullNumbers.add(context.payload.pull_request.number);
            } else {
              const before = context.payload.before;
              const range = /^0+$/.test(before)
                ? [context.sha, '-1']
                : [`${before}..${context.sha}`];
              const messages = await exec.getExecOutput(
                'git', ['log', '--format=%B', ...range], { silent: true }
              );
              skip = messages.stdout.includes('#skip');

              // Recover original PR messages even when a squash message omits #skip.
              const commits = await exec.getExecOutput(
                'git', ['rev-list', ...range], { silent: true }
              );
              for (const sha of commits.stdout.trim().split('\n').filter(Boolean)) {
                const pulls = await github.paginate(
                  github.rest.repos.listPullRequestsAssociatedWithCommit,
                  { owner, repo, commit_sha: sha, per_page: 100 }
                );
                for (const pull of pulls) {
                  if (pull.merged_at && pull.base.ref === 'main') {
                    pullNumbers.add(pull.number);
                  }
                }
              }
            }

            for (const pull_number of pullNumbers) {
              const commits = await github.paginate(
                github.rest.pulls.listCommits,
                { owner, repo, pull_number, per_page: 100 }
              );
              skip ||= commits.some(({ commit }) => commit.message.includes('#skip'));
              // GitHub limits this endpoint to 250 commits; never release on an incomplete check.
              const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number });
              if (!skip && commits.length < pull.commits) {
                throw new Error(`Cannot check every commit in PR #${pull_number}; release blocked.`);
              }
            }

            core.setOutput('skip', String(skip));

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Check style
        run: npm run eslint
      - name: Run unit tests
        run: npm test -- --watch=false
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e
      - name: Build application
        run: npm run build

  deploy:
    needs: build_and_test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build_and_test.outputs.skip == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error "$RENDER_DEPLOY_HOOK"

  tag_release:
    needs: deploy
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          RELEASE_BRANCHES: main
          TAG_PREFIX: v

  notify_success:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord on successful deployment
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          title: 'Deployment successful'
          description: 'A new version has been deployed successfully.'
          color: 0x00ff00

  notify_failure:
    needs: deploy
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord on pipeline failure
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          title: 'CI/CD Pipeline Failed'
          description: |
            Commit: ${{ github.event.head_commit.message }}
            Author: ${{ github.actor }}
            SHA: ${{ github.sha }}
            Repository: ${{ github.repository }}
          url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          color: 0xff0000
