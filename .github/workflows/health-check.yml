name: Periodic Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed application
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://fullstack-cicd-gt38.onrender.com/health
          follow-redirect: false
          max-attempts: 3
          retry-delay: 5s
